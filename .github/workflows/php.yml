name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        coverage: pcov

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('composer.lock', 'composer-patches.json', 'patches.lock.json', 'patches/**') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Apply Composer patches
      run: composer patches-repatch --no-interaction

    - name: Run tests and check coverage
      run: composer test:coverage:check -- --no-tia --parallel --processes=2

#    - name: Check mutation score
#      run: composer test:mutation:check -- --no-tia --parallel --processes=2
    - name: Check mutation score
      shell: bash
      run: |
        (
          while true; do
            echo "=== Memory usage: $(date -u +%FT%TZ) ==="
            free -m
            ps -eo pid,ppid,rss,comm --sort=-rss | head -n 16
            sleep 15
          done
        ) &
        monitor_pid=$!
        trap 'kill "$monitor_pid" || true' EXIT

        composer test:mutation:check -- --no-tia --parallel --processes=4