name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        coverage: pcov

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('composer.lock', 'composer-patches.json', 'patches.lock.json', 'patches/**') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Apply Composer patches
      run: composer patches-repatch --no-interaction

    - name: Run tests and check coverage
      run: composer test:coverage:check -- --no-tia --parallel --processes=2

    - name: Check mutation score
      shell: bash
      run: |
        (
          while true; do
            echo "=== Memory usage: $(date -u +%FT%TZ) ==="
            free -m
            ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,16p'
            while read -r pid rss; do
              echo "=== PHP worker: PID=$pid RSS=${rss}KiB ==="
              if [[ -r "/proc/$pid/environ" ]]; then
                tr '\0' '\n' < "/proc/$pid/environ" |
                  grep -E '^PEST_MUTATION_(TESTING|FILE)=' || true
              fi
            done < <(
              ps -C php -o pid=,rss= |
                awk '$2 > 524288 { print $1, $2 }'
            )
            sleep 5
          done
        ) &
        monitor_pid=$!
        trap 'kill "$monitor_pid" || true' EXIT

        composer test:mutation:check -- --no-tia --parallel --processes=1 --no-cache

    - name: Save mutation files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutation-files
        path: vendor/pestphp/pest-plugin-mutate/.temp/mutations/
        include-hidden-files: true